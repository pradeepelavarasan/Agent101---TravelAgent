<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Travel Agent</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Travel AI">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-left">
                <h1>AI Travel Agent ✈️</h1>
            </div>
            <div class="header-right">
                <button id="new-session-btn" class="icon-btn header-btn" title="Start New Session">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
                <button id="brain-btn" class="icon-btn header-btn" title="View Under the Hood">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path></svg>
                </button>
            </div>
        </header>

        <main id="chat-container">
            <div class="welcome-message">
                <h2>Ready for your next adventure?</h2>
                <p>Ask me anything about your travel plans.</p>
            </div>
            <div id="messages"></div>
            <div id="ephemeral-container"></div>
        </main>

        <footer>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Ask about your travel plans..." autocomplete="off">
                <button id="send-btn" class="icon-btn send-btn" title="Send message">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </footer>

        <!-- Under the Hood Overlay -->
        <div id="under-the-hood-view" class="hidden">
            <div class="uth-header">
                <button id="close-uth-btn" class="icon-btn header-btn" title="Close">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <h2 id="uth-title">Session History</h2>
                <div style="width:42px;"></div> <!-- spacer -->
            </div>

            <!-- L1 Screen: Session List -->
            <div id="sessions-list-view" class="uth-content">
                <!-- Session cards will be injected here -->
            </div>

            <!-- L2 Screen: Session Details / Timeline -->
            <div id="session-details-view" class="uth-content hidden">
                <button id="back-to-sessions-btn" class="text-btn back-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back to Sessions
                </button>
                <div id="timeline-container">
                    <!-- Timeline items will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=3"></script>
</body>
</html>
